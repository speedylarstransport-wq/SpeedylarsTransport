{% extends "./plantilla.html" %}
{% load static %}
{% block contenido %}

<br>

<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión | SpeedyLars</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" href="{% static 'assets/images/logos/logo.png' %}">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-dark: #0B2C5D;
      --primary-blue: #1F4FA3;
      --accent-orange: #F57C00;
      --accent-yellow: #FFA726;
      --light-bg: #f8fafc;
      --card-shadow: 0 10px 30px rgba(11, 44, 93, 0.12);
    }

    /* Contenedor simplificado - sin fondos decorativos que expandan */
    .login-wrapper {
      font-family: 'Poppins', sans-serif;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Card compacta */
    .login-card {
      border-radius: 20px;
      border: none;
      background: white;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    /* Header simplificado sin panel lateral */
    .login-header {
      padding: 1.8rem 2rem 1rem 2rem;
      text-align: center;
      background: white;
    }

    .logo-mini {
      width: 65px;
      margin-bottom: 1rem;
    }

    .login-title {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }

    .title-accent {
      color: var(--accent-orange);
    }

    .login-subtitle {
      color: #6c757d;
      font-size: 0.85rem;
      margin-bottom: 0;
    }

    /* Cuerpo del formulario */
    .login-body {
      padding: 0 2rem 1.8rem 2rem;
    }

    .accent-line {
      height: 3px;
      width: 50px;
      background: linear-gradient(to right, var(--accent-orange), var(--accent-yellow));
      border-radius: 2px;
      margin: 0.8rem auto 1.5rem auto;
    }

    /* Campos de formulario compactos */
    .form-floating {
      margin-bottom: 1rem;
    }

    .form-floating > .form-control {
      height: calc(3rem + 2px);
      padding: 0.8rem 0.8rem;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background-color: #f8fafc;
      font-size: 0.9rem;
    }

    .form-floating > label {
      padding: 0.8rem 0.8rem;
      color: #64748b;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .form-floating > .form-control:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 0.2rem rgba(31, 79, 163, 0.1);
      background-color: white;
    }

    /* Campo de contraseña compacto */
    .password-container {
      position: relative;
      margin-bottom: 1rem;
    }

    .password-container .form-control {
      height: calc(3rem + 2px);
      padding: 0.8rem 2.2rem 0.8rem 0.8rem;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background-color: #f8fafc;
      width: 100%;
      font-size: 0.9rem;
    }

    .password-container .form-control:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 0.2rem rgba(31, 79, 163, 0.1);
      background-color: white;
      outline: none;
    }

    .password-label {
      position: absolute;
      top: 0;
      left: 0;
      padding: 0.8rem 0.8rem;
      color: #64748b;
      font-weight: 500;
      pointer-events: none;
      transition: all 0.2s;
      transform-origin: 0 0;
      font-size: 0.85rem;
    }

    .password-container .form-control:focus ~ .password-label,
    .password-container .form-control:not(:placeholder-shown) ~ .password-label {
      transform: translateY(-0.45rem) scale(0.85);
      color: var(--primary-blue);
    }

    .toggle-password {
      position: absolute;
      right: 0;
      top: 0;
      height: calc(3rem + 2px);
      width: 2.8rem;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .toggle-password:hover {
      color: var(--primary-blue);
    }

    .forgot-link {
      color: var(--primary-blue);
      font-size: 0.75rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }

    .forgot-link:hover {
      color: var(--accent-orange);
      text-decoration: none;
    }

    .forgot-link i {
      margin-right: 4px;
      font-size: 0.7rem;
    }

    /* Botón de login compacto */
    .login-btn {
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 0.7rem;
      width: 100%;
      margin-top: 1.2rem;
      transition: all 0.2s;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(245, 124, 0, 0.2);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 124, 0, 0.25);
      color: white;
    }

    /* Footer compacto */
    .form-footer {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
      padding-top: 1rem;
      border-top: 1px solid #eef2f6;
    }

    /* Alerta flotante */
    .alert-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      min-width: 260px;
      max-width: 350px;
      font-size: 0.85rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    /* Responsive */
    @media (max-width: 560px) {
      .login-header, .login-body {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
      
      .login-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body style="background: transparent; min-height: auto; display: block; padding: 20px;">
  <!-- Wrapper compacto sin decoraciones de fondo -->
  <div class="login-wrapper">
    <div class="card login-card">
      
      <!-- Header con logo y título -->
      <div class="login-header">
        <img src="{% static 'img/logo.jpeg' %}" alt="SpeedyLars" class="logo-mini">
        <h1 class="login-title">Speedy<span class="title-accent">Lars</span></h1>
        <p class="login-subtitle">Accede al sistema de gestión logística</p>
        <div class="accent-line"></div>
      </div>

      <!-- Formulario -->
      <div class="login-body">
        <form method="POST" action="{% url 'login' %}" id="loginForm">
          {% csrf_token %}
          
          <!-- Campo de usuario -->
          <div class="form-floating">
            <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
            <label for="username">
              <i class="fas fa-user me-1"></i>Usuario
            </label>
          </div>

          <!-- Campo de contraseña -->
          <div class="password-container">
            <input type="password" class="form-control" id="password" name="password" placeholder=" " required>
            <label class="password-label" for="password">
              <i class="fas fa-lock me-1"></i>Contraseña
            </label>
            <button type="button" class="toggle-password" id="togglePassword">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>

          <div class="d-flex justify-content-end mt-1">
            <a href="{% url 'recuperar_contrasena' %}" class="forgot-link">
              <i class="fas fa-key"></i> ¿Olvidó su contraseña?
            </a>
          </div>

          <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt me-2"></i> Ingresar
          </button>
        </form>

        <div class="form-footer">
          <p class="mb-0">© SpeedyLars Transport</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', () => {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      
      if (type === 'password') {
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    });

    // Form validation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (!username || !password) {
        e.preventDefault();
        showAlert('error', 'Por favor, complete todos los campos.');
        return;
      }
      
      const submitBtn = this.querySelector('.login-btn');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Verificando...';
      submitBtn.disabled = true;
      
      setTimeout(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }, 3000);
    });

    function showAlert(type, message) {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type === 'error' ? 'danger' : 'success'} alert-dismissible fade show alert-toast`;
      alertDiv.innerHTML = `
        <strong>${type === 'error' ? 'Error' : 'Éxito'}</strong> ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      
      document.body.appendChild(alertDiv);
      
      setTimeout(() => {
        if (alertDiv.parentNode) {
          alertDiv.parentNode.removeChild(alertDiv);
        }
      }, 5000);
    }

    {% if messages %}
      {% for message in messages %}
        {% if message.tags == 'error' or 'credenciales' in message|lower or 'incorrecto' in message|lower or 'inválido' in message|lower %}
        showAlert('{{ message.tags }}', '{{ message|escapejs }}');
        {% endif %}
      {% endfor %}
    {% endif %}
  </script>
</body>
</html>

    {% endblock %}
